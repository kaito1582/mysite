<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant English</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Sidebar overlay (click to close) ───────────────── -->
  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <!-- ── Sidebar ────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">⚡</div>
        <span class="sidebar-logo-text">Instant English</span>
      </div>
      <button class="sidebar-close" onclick="closeMenu()" aria-label="メニューを閉じる">✕</button>
    </div>

    <nav class="sidebar-nav">
      <p class="sidebar-section">メニュー</p>

      <button class="nav-item active" onclick="navigate(this, 'practice')">
        <span class="nav-item-icon">📝</span>
        練習
        <span class="nav-item-badge">Now</span>
      </button>

      <button class="nav-item" onclick="navigate(this, 'history')">
        <span class="nav-item-icon">📖</span>
        履歴
      </button>

      <button class="nav-item" onclick="navigate(this, 'ranking')">
        <span class="nav-item-icon">🏆</span>
        スコアランキング
      </button>

      <p class="sidebar-section">その他</p>

      <button class="nav-item" onclick="navigate(this, 'settings')">
        <span class="nav-item-icon">⚙️</span>
        設定
      </button>
    </nav>

    <p class="sidebar-footer">Instant English v1.0</p>
  </aside>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <button class="hamburger" onclick="toggleMenu()" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <span class="logo-text">Instant English</span>
      </div>
    </div>
    <span class="page-title" id="page-title">練習</span>
  </header>

  <!-- ── Main ───────────────────────────────────────────── -->
  <main>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="score">0</span>
        <span class="stat-label">正解</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="streak">0</span>
        <span class="stat-label">連続正解</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="total">0</span>
        <span class="stat-label">合計</span>
      </div>
    </div>

    <!-- Level selector -->
    <div class="level-selector">
      <button class="level-btn active" onclick="setLevel(this, 'beginner')">初級</button>
      <button class="level-btn"        onclick="setLevel(this, 'intermediate')">中級</button>
      <button class="level-btn"        onclick="setLevel(this, 'advanced')">上級</button>
    </div>

    <!-- Question card -->
    <div class="question-card">
      <span class="question-badge">🇯🇵 → 🇬🇧 瞬間英作文</span>
      <p class="question-label">次の日本語を英語にしてください</p>
      <p class="question-text" id="question">問題を読み込んでいます...</p>

      <div class="input-wrapper">
        <input
          type="text"
          id="answer-input"
          placeholder="英語で入力してください..."
          onkeydown="handleKey(event)"
          autocomplete="off"
        />
        <button class="speak-btn" onclick="speak()" title="正解を読み上げる">🔊</button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="skipQuestion()">スキップ</button>
        <button class="btn btn-primary"   onclick="checkAnswer()">答え合わせ →</button>
      </div>
    </div>

  </main>

  <!-- ── Footer ─────────────────────────────────────────── -->
  <footer>Instant English — AI powered by Claude</footer>

  <!-- ── Scripts ────────────────────────────────────────── -->
  <script src="app.js"></script>
  <script>
    // ── Sidebar ──────────────────────────────────────────
    function toggleMenu() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('show');
    }

    function closeMenu() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    // ── Navigation ───────────────────────────────────────
    const PAGE_NAMES = {
      practice: '練習',
      history:  '履歴',
      ranking:  'スコアランキング',
      settings: '設定',
    };

    function navigate(btn, page) {
      // ページタイトルを更新
      document.getElementById('page-title').textContent = PAGE_NAMES[page] ?? page;

      // アクティブ状態を更新
      document.querySelectorAll('.nav-item').forEach((el) => el.classList.remove('active'));
      btn.classList.add('active');

      closeMenu();

      // TODO: ページ切り替えロジックをここに追加
      console.log('Navigate to:', page);
    }
  </script>

</body>
</html>
